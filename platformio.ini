[platformio]
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:tools/freertos.py
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Iinclude
check_tool = cppcheck
check_flags = --enable=warning,style,performance,portability

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++17 -Iinclude
